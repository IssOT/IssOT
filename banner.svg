<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD3F7"/>
      <stop offset="0.45" stop-color="#1E90D6"/>
      <stop offset="1" stop-color="#0B3D6B"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <g id="jelly">
      <path d="M-34 0 A34 26 0 0 1 34 0 Q0 8 -34 0 Z" fill="#E8F7FF" fill-opacity="0.85"/>
      <path d="M-20 4 Q-24 22 -18 36 M-6 6 Q-10 26 -4 42 M8 6 Q12 26 6 40 M22 4 Q26 20 20 34" stroke="#E8F7FF" stroke-opacity="0.7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="320" fill="url(#sea)"/>
  <polygon points="150,0 260,0 420,320 230,320" fill="url(#ray)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="620,0 720,0 900,320 700,320" fill="url(#ray)">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="8s" repeatCount="indefinite"/>
  </polygon>
  <use href="#jelly" x="140" y="120">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-18;0,0" dur="5s" repeatCount="indefinite"/>
  </use>
  <use href="#jelly" x="1060" y="150">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-24;0,0" dur="7s" repeatCount="indefinite"/>
  </use>
  <g fill="none" stroke="#E8F7FF" stroke-opacity="0.7" stroke-width="1.5">
    <circle cx="300" cy="330" r="6"><animate attributeName="cy" values="330;-20" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="330" r="9"><animate attributeName="cy" values="330;-20" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="330" r="5"><animate attributeName="cy" values="330;-20" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="330" r="8"><animate attributeName="cy" values="330;-20" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="330" r="4"><animate attributeName="cy" values="330;-20" dur="7s" begin="4s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0 40 Q75 10 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 T1350 40 T1500 40 V0 H0 Z" fill="#FFFFFF" fill-opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M0 290 Q75 260 150 290 T300 290 T450 290 T600 290 T750 290 T900 290 T1050 290 T1200 290 T1350 290 T1500 290 V320 H0 Z" fill="#0B3D6B" fill-opacity="0.75">
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="150" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">Ivan Sigit Santoso</text>
  <text x="600" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#E0F4FF">Computer Engineering Technology | IoT | AI | Web | Data</text>
  <circle cx="600" cy="236" r="5" fill="#FF5A3C"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
</svg>
